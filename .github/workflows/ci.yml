name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  node-parity-tests:
    name: Node signing-parity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run signing parity tests
        run: node --test tests/signing-parity.test.mjs

  kotlin-unit-tests:
    name: Android/Kotlin unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --info 2>&1 | tee /tmp/gradle.log

      - name: Dump gradle output to summary on failure
        if: failure()
        run: |
          echo '## Gradle/Kotlin output (tail)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -400 /tmp/gradle.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  verify:
    name: Repo layout verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run verify.sh
        run: ./verify.sh
